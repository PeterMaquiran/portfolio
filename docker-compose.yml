services:
  portfolio:
    build: .
    image: registry.tvone.ao/portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SQLITE_PATH: /data/chat.db
      ADMIN_PASSWORD: tabteste@006
    volumes:
      - chat-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  chat-data:
